name: Ingest Statements

# JOB-2 (docs/cardledger-build-spec.md §7). GitHub Actions runtime because
# Supabase Edge Functions (Deno) cannot shell out to qpdf to decrypt a
# password-protected statement PDF (§2). Runs daily; reconcile.yml runs
# immediately after via workflow_run.

on:
  schedule:
    - cron: "0 1 * * *" # 09:00 SGT (UTC+8)
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ingest-statements
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Pinned to a commit SHA, not a mutable tag: this job holds the
      # service_role key, Gmail refresh token, Anthropic key and PDF
      # password simultaneously (§11) — a mutable @v4/@v5 tag could be
      # repointed upstream to a compromised commit that exfiltrates all
      # four secrets on the next run.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install qpdf and poppler-utils
        run: sudo apt-get update && sudo apt-get install -y qpdf poppler-utils

      - name: Install Python dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run ingest-statements
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          STATEMENT_PDF_PASSWORD: ${{ secrets.STATEMENT_PDF_PASSWORD }}
        # Never echo secrets or decrypted statement lines in this workflow —
        # Actions logs persist and are readable by anyone with repo access (§11).
        run: python scripts/ingest_statements.py
